# -------------------------------------------------------------------
# General Behaviour
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = "<C-h>"
run  = "hidden toggle"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on   = "E"
run  = "open --interactive --hovered"
desc = "Open with..."

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "open --hovered"
desc = "Open hovered file"

[[mgr.prepend_keymap]]
on   = "Q"
run  = "quit --no-cwd-file"
desc = "Quit without changing shell directory"

# -------------------------------------------------------------------
# Ranger-style path copying
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = [ "y", "p" ]
run  = "copy path"
desc = "Copy full path"

[[mgr.prepend_keymap]]
on   = [ "y", "d" ]
run  = "copy dirname"
desc = "Copy parent directory"

[[mgr.prepend_keymap]]
on   = [ "y", "n" ]
run  = "copy filename"
desc = "Copy filename"

[[mgr.prepend_keymap]]
on   = [ "y", "N" ]
run  = "copy name_without_ext"
desc = "Copy filename without extension"

# Optional Unix-style paths for Bash commands
[[mgr.prepend_keymap]]
on   = [ "y", "u" ]
run  = "copy path --separator=unix"
desc = "Copy path with forward slashes"

# -------------------------------------------------------------------
# Rename and creation
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = [ "c", "w" ]
run  = "rename"
desc = "Rename or bulk rename"

[[mgr.prepend_keymap]]
on   = [ "m", "k", "d" ]
run  = "create --dir"
desc = "Create directory"

# Preserve the extension and replace the stem.
[[mgr.prepend_keymap]]
on   = "I"
run  = "rename --empty=stem --cursor=start"
desc = "Rename stem, preserve extension"

# Put the cursor immediately before the extension.
[[mgr.prepend_keymap]]
on   = "A"
run  = "rename --cursor=before_ext"
desc = "Rename before extension"

# # -------------------------------------------------------------------
# Searching and filtering
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = "/"
run  = "find --smart"
desc = "Find in current directory"

[[mgr.prepend_keymap]]
on   = "n"
run  = "find_arrow"
desc = "Next match"

[[mgr.prepend_keymap]]
on   = "N"
run  = "find_arrow --previous"
desc = "Previous match"

[[mgr.prepend_keymap]]
on   = [ "z", "f" ]
run  = "filter --smart"
desc = "Filter current directory"

[[mgr.prepend_keymap]]
on   = [ "s", "f" ]
run  = "search --via=fd"
desc = "Search filenames recursively"

[[mgr.prepend_keymap]]
on   = [ "s", "g" ]
run  = "search --via=rg"
desc = "Search file contents"

# -------------------------------------------------------------------
# Sorting
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = [ "o", "n" ]
run  = "sort natural --dir-first"
desc = "Sort naturally"

[[mgr.prepend_keymap]]
on   = [ "o", "s" ]
run  = "sort size --dir-first"
desc = "Sort by size"

[[mgr.prepend_keymap]]
on   = [ "o", "m" ]
run  = "sort mtime --reverse --dir-first"
desc = "Sort newest first"

[[mgr.prepend_keymap]]
on   = [ "o", "M" ]
run  = "sort mtime --dir-first"
desc = "Sort oldest first"

[[mgr.prepend_keymap]]
on   = [ "o", "e" ]
run  = "sort extension --dir-first"
desc = "Sort by extension"

[[mgr.prepend_keymap]]
on   = [ "o", "r" ]
run  = "sort reverse"
desc = "Reverse current sorting"

# -------------------------------------------------------------------
# Tabs
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "tab_create --current"
desc = "New tab in current directory"

[[mgr.prepend_keymap]]
on   = [ "t", "t" ]
run  = "close"
desc = "Close tab"

[[mgr.prepend_keymap]]
on   = "<Tab>"
run  = "tab_switch 1 --relative"
desc = "Next tab"

[[mgr.prepend_keymap]]
on   = "<BackTab>"
run  = "tab_switch -1 --relative"
desc = "Previous tab"

[[mgr.prepend_keymap]]
on   = "<A-1>"
run  = "tab_switch 0"
desc = "Switch to tab 1"

[[mgr.prepend_keymap]]
on   = "<A-2>"
run  = "tab_switch 1"
desc = "Switch to tab 2"

[[mgr.prepend_keymap]]
on   = "<A-3>"
run  = "tab_switch 2"
desc = "Switch to tab 3"

[[mgr.prepend_keymap]]
on   = "<A-4>"
run  = "tab_switch 3"
desc = "Switch to tab 4"

# -------------------------------------------------------------------
# Directory and drive jumps
# Edit these paths for your actual layout.
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = [ "g", "h" ]
run  = "cd ~"
desc = "Go to home"

[[mgr.prepend_keymap]]
on   = [ "g", "C" ]
run  = "cd C:"
desc = "Go to C drive"

# # [[mgr.prepend_keymap]]
# # on   = [ "g", "D" ]
# # run  = "cd D:"
# # desc = "Go to D drive"

[[mgr.prepend_keymap]]
on   = [ "g", "E" ]
run  = "cd E:"
desc = "Go to E drive"

# [[mgr.prepend_keymap]]
# on   = [ "g", "G" ]
# run  = "cd G:"
# desc = "Go to G drive"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = 'cd E:/Documents'
desc = "Go to documents"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = 'cd E:/Downloads'
desc = "Go to downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = 'cd E:/Projects'
desc = "Go to projects"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'cd E:/Repos'
desc = "Go to repos"

# -------------------------------------------------------------------
# Shell access
# -------------------------------------------------------------------

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell --interactive --block'
desc = "Run shell command"

[[mgr.prepend_keymap]]
on   = [ "g", "b" ]
run  = 'shell "C:\Program Files\Git\bin\bash.exe" --block'
desc = "Open Git Bash here"
